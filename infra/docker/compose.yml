# Local development stack — the whole system in one command.
#
#   docker compose -f infra/docker/compose.yml up
#
#   web       http://localhost:3000    the app
#   api       http://localhost:8000    FastAPI (docs at /docs)
#   mailpit   http://localhost:8025    local mail inspection
#
# Every published port is overridable, because developer machines run other stacks.
# If a port is taken, set it in infra/docker/.env — see .env.example.
#
# Source is bind-mounted, so both api and web hot-reload on edit. This targets the
# `dev` stage of each Dockerfile; the `runner` stages are what deploy.
#
# Not a production manifest. Passwords here are deliberately trivial and the
# services bind to localhost only.

name: projectemail

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projectemail
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Catches all outbound-looking test mail locally. Send to :1025, read at :8025.
  # Nothing here ever touches a real mail server.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${SMTP_PORT:-1025}:1025"   # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  api:
    build:
      context: ../../backend
      target: dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: development
      SECRET_KEY: dev-only-not-a-real-secret
      # Defaults to the local container. Override in infra/docker/.env to point at Neon —
      # a value set here wins over backend/.env, which the container ignores entirely.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/projectemail}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      APP_ORIGIN: http://localhost:${WEB_PORT:-3000}
      SANDBOX_ORIGIN: http://localhost:${SANDBOX_PORT:-8001}
      SMTP_LISTEN_PORT: "1025"
      SMTP_HOST: mailpit
      INBOUND_WEBHOOK_SECRET: dev-webhook-secret
      RUN_MIGRATIONS_ON_STARTUP: "true"
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      # Source mounted for hot reload. The anonymous volume keeps the image's .venv
      # from being shadowed by the host directory.
      - ../../backend:/app
      - /app/.venv
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build:
      context: ../../frontend
      target: dev
    environment:
      # Browser-side calls, so this is the host's view of the API, not the compose network's.
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
      NEXT_PUBLIC_SANDBOX_ORIGIN: http://localhost:${SANDBOX_PORT:-8001}
      WATCHPACK_POLLING: "true"
    ports: ["${WEB_PORT:-3000}:3000"]
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on: [api]

volumes:
  postgres-data:
