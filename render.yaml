# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the FastAPI backend. The frontend stays on GitHub Pages (static), and the
# two talk over HTTPS. See docs/DEPLOYMENT.md.
#
# Secrets are NEVER in this file. Anything marked `sync: false` must be set in the
# Render dashboard — that includes the Neon connection string.

services:
  - type: web
    name: projectemail-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Builds the deployable stage, not `dev`.
    dockerCommand: ""
    plan: free
    region: oregon
    branch: main
    # Only rebuild when the backend actually changes.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    # Liveness only — deliberately does not touch the database, so a Neon cold start
    # cannot cause Render to kill the container.
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # MUST be 1. Fanout to SSE connections is in-process for the MVP, so a webhook
      # landing on worker A while the user's stream is held by worker B means that user
      # never sees their mail. On 0.1 CPU one async worker is the right shape anyway.
      # See docs/adr/0003-no-redis-for-mvp.md.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"

      # --- Set these in the Render dashboard. Never commit them. ---
      # Neon POOLED connection string, pasted exactly as the Console gives it.
      - key: DATABASE_URL
        sync: false
      # Neon DIRECT (unpooled) endpoint — DDL through PgBouncer is unreliable.
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Comma-separated. Must include the GitHub Pages origin or the browser blocks
      # every request with a CORS error.
      - key: APP_ORIGIN
        value: https://bansi1701.github.io
      - key: SANDBOX_ORIGIN
        sync: false
      # Shared secret the Cloudflare Email Worker presents. The webhook refuses to run
      # without it — an open inbound endpoint lets anyone inject mail into any inbox.
      - key: INBOUND_WEBHOOK_SECRET
        generateValue: true
