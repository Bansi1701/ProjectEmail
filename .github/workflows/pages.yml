name: Deploy Pages

# Rebuilds the static welcome/SEO surface on every push to main.
#
# Scope note: this deploys the STATIC pages only. The inbox app needs FastAPI,
# Redis and an SMTP listener and cannot run on GitHub Pages — it deploys to a
# real host from the Docker images. See docs/ARCHITECTURE.md.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; let it land, then run the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        # NEXT_PUBLIC_* values are baked into the client bundle at build time and are
        # PUBLIC — every visitor can read them. Only the API's URL belongs here.
        # Never put a database URL, API key or secret in a NEXT_PUBLIC_ variable.
        #
        # Set API_URL as a repository variable (Settings → Secrets and variables →
        # Actions → Variables). Until the backend is deployed it falls back to the
        # placeholder below, and the inbox simply cannot reach an API.
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'https://api.invalid' }}
          NEXT_PUBLIC_SANDBOX_ORIGIN: ${{ vars.SANDBOX_ORIGIN || 'https://sandbox.invalid' }}
        run: BUILD_TARGET=pages pnpm build

      # Jekyll drops every _next/ directory without this, and the site loads unstyled.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
